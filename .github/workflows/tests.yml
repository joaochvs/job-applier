name: Tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  local-tests:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: job-applier-app/package-lock.json
      - run: python setup.py
      - run: npm ci --ignore-scripts
        working-directory: job-applier-app
      - run: python -m unittest discover -s tests -p 'test_*.py'
      - run: python -m unittest discover -s job-applier-app -p 'test_*.py'
      - run: npm test
        working-directory: job-applier-app
